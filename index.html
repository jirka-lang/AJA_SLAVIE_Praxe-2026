<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praxe 2026 | SK Slavia Praha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Gate: invalid/missing token -->
    <div id="gate" class="hidden">
        <div class="gate-box">
            <img src="logo-badge.jpg" alt="SK Slavia Praha" class="logo">
            <h1>PRAXE 2026</h1>
            <p class="gate-subtitle">Oddil mladeze SK Slavia Praha</p>
            <div class="gate-error">
                <p>Neplatny nebo chybejici pristupovy odkaz.</p>
                <p>Pouzijte odkaz, ktery jste obdrzeli od klubu.</p>
            </div>
        </div>
    </div>

    <!-- Dashboard: valid token -->
    <div id="dashboard" class="hidden">
        <header>
            <div class="header-left">
                <img src="logo-badge.jpg" alt="SK Slavia Praha" class="header-logo">
                <div>
                    <h1>PRAXE 2026</h1>
                    <p class="subtitle">SK Slavia Praha &mdash; Oddil mladeze</p>
                </div>
            </div>
            <div class="header-right">
                <span id="student-name" class="student-name"></span>
                <span id="student-meta" class="student-meta"></span>
            </div>
        </header>

        <div class="header-stripe"></div>

        <main>
            <!-- Today's overview -->
            <section id="today-section" class="card">
                <h2 id="today-title">Dnes</h2>
                <div id="today-content"></div>
            </section>

            <!-- Full schedule -->
            <section class="card">
                <div class="card-header">
                    <h2>Kompletni rozvrh</h2>
                    <div class="actions">
                        <button onclick="printSchedule()" class="btn btn-secondary">Tisk</button>
                        <button onclick="downloadHTML()" class="btn btn-primary">Stahnout HTML</button>
                    </div>
                </div>
                <div id="schedule-table"></div>
                <div id="schedule-cards"></div>
            </section>

            <!-- Stats -->
            <section class="card">
                <h2>Statistiky</h2>
                <div id="stats" class="stats-grid"></div>
            </section>
        </main>

        <footer>
            <img src="logo-star.jpg" alt="" class="footer-logo">
            <p>Aktualizovano: <span id="last-updated"></span></p>
            <p class="footer-club">SK Slavia Praha &mdash; Oddil mladeze</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
